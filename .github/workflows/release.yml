name: Release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: test "$RELEASE_TAG" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm run build:apple
      - run: bin/ownmode-apple self-test
      - run: npm run build:menubar
      - run: test "$RELEASE_TAG" = "v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'build/OwnMode Connect.app/Contents/Info.plist')"
      - run: hdiutil verify build/OwnMode-Connect-MenuBar.dmg
      - run: sh menubar/test.sh
      - run: mkdir -p dist && npm pack --pack-destination dist
      - run: cp build/OwnMode-Connect-MenuBar.{zip,dmg} dist/
      - name: Checksum release artifacts
        run: (cd dist && shasum -a 256 ./*.tgz ./*.zip ./*.dmg > SHA256SUMS)
      - name: Publish verified tag artifacts
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "OwnMode Connect $RELEASE_TAG" --notes-file RELEASE-NOTES.md
